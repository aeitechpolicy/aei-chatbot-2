name: Harvest AEI Index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  harvest:
    runs-on: [self-hosted, aei-network]
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Run full harvest
        working-directory: backend
        env:
          NODE_EXTRA_CA_CERTS: certs/digicert-global-g2-tls-rsa-sha256-2020-ca1.pem
        run: node scripts/harvest-aei-index.js
      - name: Commit index changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/aei-index.json backend/data/aei-authors.json
          git diff --cached --quiet || git commit -m "Harvest AEI index"
          git pull --rebase origin main
          git push
