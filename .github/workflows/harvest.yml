# .github/workflows/harvest.yml
#
# Full harvest of the AEI WordPress REST API into backend/data/aei-index.json
# and backend/data/aei-authors.json. Manual dispatch only — no schedule.
# Runs harvest-aei-index.js with no flags, which means full-harvest mode:
# every content type is re-fetched in full (see harvest-aei-index.js:
# --modified-after triggers incremental/partial mode instead). This is an
# archive, not a mirror — existing records are never dropped. A full harvest
# sees the complete live set, so any existing record that doesn't reappear
# gets marked delisted_at with its url cleared rather than removed.
#
# data/aei-index.json is filter=lfs in backend/.gitattributes (~133MB), so
# `git lfs install` runs right after checkout to register the clean filter —
# without it, `git add` on a fresh runner would commit the raw JSON blob
# instead of an LFS pointer.

name: Harvest AEI Index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Git LFS
        run: git lfs install

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run full harvest
        working-directory: backend
        run: node scripts/harvest-aei-index.js

      - name: Commit index changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/aei-index.json backend/data/aei-authors.json
          git diff --cached --quiet || git commit -m "Harvest AEI index"
          git push
