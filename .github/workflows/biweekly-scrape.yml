# .github/workflows/biweekly-scrape.yml
#
# Uses standard GitHub-hosted Linux with AEI's public production API.
# Runs every other week: incrementally harvests anything new from the AEI
# API since the last window, then scrapes full text for any new article by
# the four served scholars (backend/utils/servedScholars.js) that isn't in
# knowledge_base/ yet or has a newer catalog modification, and commits verified
# progress. Missed runs extend the catch-up window from the last success. This is the "keep the archive
# current" counterpart to harvest.yml (manual, full-replace) and
# backfill-metadata.yml (manual, matches existing knowledge_base files to
# URLs) — this workflow is the only one that adds brand-new article content
# on its own.
#
# GitHub Actions cron has no native "every N weeks" schedule, so this uses a
# weekly trigger gated by ISO week parity (check-week job) to land on a true
# 14-day cadence. Which weeks are "even" vs "odd" is arbitrary and doesn't
# matter — what matters is it's consistently every other Monday from here on.
# Manual dispatch always runs regardless of week parity.
#
# Pipeline (see fetch-missing-articles.js's own header for why the match
# step runs both before and after the fetch step):
#   1. harvest-aei-index.js --modified-after=<~20 days ago>   (incremental,
#      never deletes — see harvest-aei-index.js's mergeRecords comment)
#   2. match-txt-to-urls.js                                   (baseline)
#   3. fetch-missing-articles.js                               (scrape new
#      served-scholar articles into knowledge_base/)
#   4. match-txt-to-urls.js                                   (pick up the
#      files step 3 just wrote)
#   5. build-slim-index.js                                    (rebuild the
#      runtime index aeiScraper.js actually reads)
#
# aei-index.json is filter=lfs (backend/.gitattributes), hence checkout uses
# lfs: true. This matters for both directions: without it, a fresh checkout
# would hand harvest-aei-index.js the small LFS pointer stub instead of the
# real file (it now always reads the existing index first for the archive/
# delist merge, so a bare pointer would crash JSON.parse() immediately), and
# `git add` would commit a raw JSON blob instead of an LFS pointer on push.

name: Biweekly Article Scrape
on:
  schedule:
    - cron: '0 8 * * 1' # every Monday 08:00 UTC; gated below to every other one
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Minimum days of edits to check; missed runs automatically extend the catch-up window'
        type: number
        required: true
        default: 20
      refresh_interviews:
        description: 'Re-check existing Shane pages for speaker labels and linked transcript PDFs (one-time catch-up)'
        type: boolean
        required: false
        default: false
      verify_only:
        description: 'Check source access and the refresh pipeline without publishing article/status changes'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: aei-library-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-week:
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run — bypassing the week-parity gate."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          week=$(date +%V)
          # 10# forces base-10 so a week like 08 or 09 isn't read as octal.
          if [ $(( 10#$week % 2 )) -eq 0 ]; then
            echo "ISO week $week — on week, running."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "ISO week $week — off week, skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  scrape:
    needs: check-week
    if: needs.check-week.outputs.should_run == 'true' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.verify_only))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install transcript text reader
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Record refresh start
        run: |
          node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "REFRESH_STARTED_AT=" + new Date().toISOString() + "\n")'

      - name: Compute catch-up window
        working-directory: backend
        env:
          LOOKBACK_DAYS: ${{ github.event_name == 'schedule' && '20' || inputs.lookback_days }}
        run: |
          since=$(node scripts/library-refresh-status.js --since)
          echo "SINCE=$since" >> "$GITHUB_ENV"

      - name: Incremental harvest
        id: harvest
        continue-on-error: true
        working-directory: backend
        run: node scripts/harvest-aei-index.js --modified-after="$SINCE"

      - name: Match existing knowledge base
        id: match
        if: steps.harvest.outcome == 'success'
        continue-on-error: true
        working-directory: backend
        run: node scripts/match-txt-to-urls.js knowledge_base

      - name: Fetch missing and modified articles and transcripts
        id: import
        if: steps.match.outcome == 'success'
        continue-on-error: true
        working-directory: backend
        env:
          REFRESH_INTERVIEWS: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_interviews && 'true' || 'false' }}
        run: node scripts/fetch-missing-articles.js

      - name: Re-match after fetch
        id: rematch
        if: steps.match.outcome == 'success' && (steps.import.outcome == 'success' || steps.import.outcome == 'failure')
        continue-on-error: true
        working-directory: backend
        run: node scripts/match-txt-to-urls.js knowledge_base

      - name: Rebuild slim runtime index
        id: index
        if: steps.rematch.outcome == 'success'
        continue-on-error: true
        working-directory: backend
        run: node scripts/build-slim-index.js

      - name: Record library refresh status
        id: report
        if: always() && !cancelled() && steps.harvest.outcome != ''
        working-directory: backend
        env:
          HARVEST_OUTCOME: ${{ steps.harvest.outcome }}
          MATCH_OUTCOME: ${{ steps.match.outcome }}
          IMPORT_OUTCOME: ${{ steps.import.outcome }}
          REMATCH_OUTCOME: ${{ steps.rematch.outcome }}
          INDEX_OUTCOME: ${{ steps.index.outcome }}
          REFRESH_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/library-refresh-status.js

      - name: Save refresh diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-refresh-report
          path: |
            backend/data/library-refresh-report.json
            backend/data/harvest-report.json
            backend/data/fetch-missing-articles-report.json
            backend/data/unmatched.json
            backend/data/author-audit.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit changes
        if: always() && !cancelled() && steps.report.outcome == 'success' && github.ref == 'refs/heads/main' && !inputs.verify_only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/library-scrape-status.json backend/data/library-refresh-report.json
          if node -e 'process.exit(require("./backend/data/library-refresh-report.json").canPublishSources ? 0 : 1)'; then
            git add backend/data/aei-index.json backend/data/aei-authors.json backend/data/aei-online-bylines.json.gz \
                    backend/data/matches.json backend/data/ambiguous.json \
                    backend/data/unmatched.json backend/data/author-audit.json \
                    backend/data/aei-index-slim.json backend/articleMetadata.json \
                    backend/data/fetch-missing-articles-report.json \
                    backend/data/harvest-report.json backend/knowledge_base
          else
            echo "Source reports are incomplete or stale: publishing diagnostics only; saved source data stays unchanged."
            # This is the disposable Actions checkout. Keep the staged status
            # files, discard unpublished source edits, and avoid rebasing a
            # dirty checkout. Diagnostic artifacts were uploaded above.
            git restore --worktree -- backend
            git clean -fd -- backend/data backend/knowledge_base
          fi
          if git diff --cached --quiet; then
            echo "No archive changes to publish."
            exit 0
          fi
          git commit -m "Biweekly scrape: harvest + fetch new served-scholar articles"

          for attempt in 1 2 3; do
            git fetch origin main
            base=$(git rev-parse FETCH_HEAD)
            git rebase "$base"
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi
            remote_head=$(git ls-remote --exit-code origin refs/heads/main | cut -f 1)
            if [ "$remote_head" = "$base" ] || [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "main advanced during the upload. Rebasing and retrying."
          done


      - name: Require a complete refresh
        if: always() && !cancelled()
        run: |
          node -e 'const fs=require("node:fs"); const p="backend/data/library-refresh-report.json"; if(!fs.existsSync(p) || !JSON.parse(fs.readFileSync(p)).complete) { console.error("Scholar Library refresh incomplete. The last successful date was not advanced. Review verified progress and unresolved items in the diagnostics artifact."); process.exit(1); }'
