# .github/workflows/biweekly-scrape.yml
#
# Runs every other week: incrementally harvests anything new from the AEI
# API since the last window, then scrapes full text for any new article by
# the four served scholars (backend/utils/servedScholars.js) that isn't in
# knowledge_base/ yet, and commits the result. This is the "keep the archive
# current" counterpart to harvest.yml (manual, full-replace) and
# backfill-metadata.yml (manual, matches existing knowledge_base files to
# URLs) — this workflow is the only one that adds brand-new article content
# on its own.
#
# GitHub Actions cron has no native "every N weeks" schedule, so this uses a
# weekly trigger gated by ISO week parity (check-week job) to land on a true
# 14-day cadence. Which weeks are "even" vs "odd" is arbitrary and doesn't
# matter — what matters is it's consistently every other Monday from here on.
# Manual dispatch always runs regardless of week parity.
#
# Pipeline (see fetch-missing-articles.js's own header for why the match
# step runs both before and after the fetch step):
#   1. harvest-aei-index.js --modified-after=<~20 days ago>   (incremental,
#      never deletes — see harvest-aei-index.js's mergeRecords comment)
#   2. match-txt-to-urls.js                                   (baseline)
#   3. fetch-missing-articles.js                               (scrape new
#      served-scholar articles into knowledge_base/)
#   4. match-txt-to-urls.js                                   (pick up the
#      files step 3 just wrote)
#   5. build-slim-index.js                                    (rebuild the
#      runtime index aeiScraper.js actually reads)
#
# aei-index.json is filter=lfs (backend/.gitattributes), hence checkout uses
# lfs: true. This matters for both directions: without it, a fresh checkout
# would hand harvest-aei-index.js the small LFS pointer stub instead of the
# real file (it now always reads the existing index first for the archive/
# delist merge, so a bare pointer would crash JSON.parse() immediately), and
# `git add` would commit a raw JSON blob instead of an LFS pointer on push.

name: Biweekly Article Scrape
on:
  schedule:
    - cron: '0 8 * * 1' # every Monday 08:00 UTC; gated below to every other one
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Days of edits to check (use a longer window to catch up after a missed run)'
        type: number
        required: true
        default: 20

permissions:
  contents: write

jobs:
  check-week:
    runs-on: [self-hosted, aei-network]
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run — bypassing the week-parity gate."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          week=$(date +%V)
          # 10# forces base-10 so a week like 08 or 09 isn't read as octal.
          if [ $(( 10#$week % 2 )) -eq 0 ]; then
            echo "ISO week $week — on week, running."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "ISO week $week — off week, skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  scrape:
    needs: check-week
    if: github.ref == 'refs/heads/main' && needs.check-week.outputs.should_run == 'true'
    runs-on: [self-hosted, aei-network]
    timeout-minutes: 120
    env:
      NODE_EXTRA_CA_CERTS: certs/digicert-global-g2-tls-rsa-sha256-2020-ca1.pem
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Compute lookback window
        env:
          LOOKBACK_DAYS: ${{ github.event_name == 'schedule' && '20' || inputs.lookback_days }}
        run: |
          since=$(node -e '
            const days = Number(process.env.LOOKBACK_DAYS);
            if (!Number.isInteger(days) || days < 1 || days > 365) {
              throw new Error("Lookback must be a whole number from 1 to 365 days");
            }
            const date = new Date();
            date.setUTCDate(date.getUTCDate() - days);
            console.log(date.toISOString().slice(0, 10) + "T00:00:00");
          ')
          echo "SINCE=$since" >> "$GITHUB_ENV"

      - name: Incremental harvest
        working-directory: backend
        run: node scripts/harvest-aei-index.js --modified-after="$SINCE"

      - name: Match existing knowledge base
        working-directory: backend
        run: node scripts/match-txt-to-urls.js knowledge_base

      - name: Fetch missing served-scholar articles
        working-directory: backend
        run: node scripts/fetch-missing-articles.js

      - name: Re-match after fetch
        working-directory: backend
        run: node scripts/match-txt-to-urls.js knowledge_base

      - name: Rebuild slim runtime index
        working-directory: backend
        run: node scripts/build-slim-index.js

      - name: Record library refresh status
        working-directory: backend
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const filename = 'data/library-scrape-status.json';
          const prior = fs.existsSync(filename) ? JSON.parse(fs.readFileSync(filename, 'utf8')) : {};
          const report = JSON.parse(fs.readFileSync('data/fetch-missing-articles-report.json', 'utf8'));
          const checked = new Date().toISOString();
          const failures = report.failed.length;
          fs.writeFileSync(filename, JSON.stringify({
            lastScrapeCheck: checked,
            lastSuccessfulScrape: failures ? prior.lastSuccessfulScrape || null : checked,
            skippedInLastScrape: failures
          }, null, 2) + '\n');
          JS

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/aei-index.json backend/data/aei-authors.json \
                  backend/data/matches.json backend/data/ambiguous.json \
                  backend/data/unmatched.json backend/data/author-audit.json \
                  backend/data/aei-index-slim.json backend/data/library-scrape-status.json backend/knowledge_base
          if git diff --cached --quiet; then
            echo "No archive changes to publish."
            exit 0
          fi
          git commit -m "Biweekly scrape: harvest + fetch new served-scholar articles"

          for attempt in 1 2 3; do
            git fetch origin main
            base=$(git rev-parse FETCH_HEAD)
            git rebase "$base"
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi
            remote_head=$(git ls-remote --exit-code origin refs/heads/main | cut -f 1)
            if [ "$remote_head" = "$base" ] || [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "main advanced during the upload. Rebasing and retrying."
          done
