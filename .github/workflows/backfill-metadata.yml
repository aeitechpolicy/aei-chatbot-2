name: Backfill Article Metadata

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of files to check"
        required: true
        default: "5"
      write_metadata:
        description: "Actually write articleMetadata.json? Use true or false"
        required: true
        default: "false"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run metadata backfill
        working-directory: backend
        env:
          LIMIT: ${{ github.event.inputs.limit }}
          WRITE_METADATA: ${{ github.event.inputs.write_metadata }}
        run: npm run backfill:metadata

      - name: Commit metadata changes
        if: github.event.inputs.write_metadata == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/articleMetadata.json
          git diff --cached --quiet || git commit -m "Backfill article metadata"
          git push
